<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="profyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a855f7"/>
            <stop offset="100%" style="stop-color:#5865F2"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#profyGrad)" filter="url(#glow)"/>
    
    <text x="100" y="135" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="900" fill="white" text-anchor="middle">P</text>
    
    <circle cx="135" cy="70" r="8" fill="white" opacity="0.9"/>
</svg>