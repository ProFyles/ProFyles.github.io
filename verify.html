<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify — Profy</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .verify-page { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 25px; text-align: center; }
        .verify-box { max-width: 420px; width: 100%; background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 20px; padding: 40px 30px; }
        .verify-logo { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 20px; background: linear-gradient(135deg, #a855f7, #5865F2); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: white; }
        .verify-box h1 { font-size: 26px; margin-bottom: 10px; }
        .verify-box p { color: #888; margin-bottom: 30px; line-height: 1.6; font-size: 14px; }
        .verify-btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 32px; background: #5865F2; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s; width: 100%; justify-content: center; }
        .verify-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(88, 101, 242, 0.4); }
        .status { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 14px; }
        .status.success { background: #0a2e1a; color: #4ade80; }
        .status.error { background: #2e0a0a; color: #f87171; }
        .status.loading { background: #1a1a2e; color: #60a5fa; }
        .user-info { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 12px; padding: 14px; margin-bottom: 16px; font-size: 13px; color: #888; text-align: left; }
        .user-info span { color: #ccc; font-weight: 600; }
    </style>
</head>
<body>

    <div class="verify-page">
        <div class="verify-box">
            <div class="verify-logo">P</div>
            <h1>Verify Discord</h1>
            <p>Link your Discord account to your Profy profile</p>

            <div id="user-info" class="user-info" style="display: none;">
                Logged in as: <span id="current-email">—</span>
            </div>

            <button id="verify-btn" class="verify-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>
                </svg>
                Continue with Discord
            </button>

            <div id="status"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('verify-btn');
        const userInfoEl = document.getElementById('user-info');
        const currentEmailEl = document.getElementById('current-email');

        if (error) {
            statusEl.className = 'status error';
            statusEl.textContent = 'Error: ' + error;
            btn.style.display = 'none';
        }

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                statusEl.className = 'status error';
                statusEl.textContent = 'You must be logged in to verify. Please login first.';
                btn.style.display = 'none';
                return;
            }

            userInfoEl.style.display = 'block';
            currentEmailEl.textContent = user.email || 'Unknown';

            // Check if already has discord linked
            if (user.identities && user.identities.some(id => id.provider === 'discord')) {
                statusEl.className = 'status loading';
                statusEl.textContent = 'Discord already linked. Completing verification...';
                await completeVerification(user);
                return;
            }

            if (!code) {
                statusEl.className = 'status loading';
                statusEl.textContent = 'Click the button below to link your Discord.';
            }
        }

        btn.addEventListener('click', async () => {
            if (code) {
                localStorage.setItem('profy_verify_code', code);
            }

            const { data, error } = await supabaseClient.auth.linkIdentity({
                provider: 'discord',
                options: {
                    redirectTo: window.location.origin + '/verify.html' + (code ? '?code=' + code : '')
                }
            });

            if (error) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Error: ' + error.message;
            }
        });

        async function completeVerification(user) {
            const discordIdentity = user.identities?.find(id => id.provider === 'discord');
            
            if (!discordIdentity) {
                statusEl.className = 'status error';
                statusEl.textContent = 'No Discord identity found. Please link Discord first.';
                return;
            }

            const discordId = discordIdentity.identity_data?.provider_id || discordIdentity.id;
            const discordUsername = discordIdentity.identity_data?.full_name || discordIdentity.identity_data?.name || 'Unknown';

            const { data, error } = await supabaseClient.rpc('verify_discord_oauth', {
                p_code: code || 'direct_link',
                p_user_id: user.id,
                p_discord_id: discordId,
                p_discord_username: discordUsername
            });

            if (error || !data || !data.success) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Error: ' + (error?.message || data?.error || 'Unknown error');
                return;
            }

            statusEl.className = 'status success';
            statusEl.textContent = '✅ Discord linked successfully! You can close this page.';
            btn.style.display = 'none';
        }

        async function checkVerification() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            if (user.identities && user.identities.some(id => id.provider === 'discord')) {
                await completeVerification(user);
            }
        }

        init();
        checkVerification();
    </script>
</body>
</html>
