<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Profy</title>
    <script>
        (function() {
            var path = window.location.pathname;
            var cleanPath = path.replace(/^\/+|\/+$/g, '');

            // Root files only
            if (cleanPath.endsWith('.html') && !cleanPath.includes('/')) {
                window.location.replace('/');
                return;
            }

            // Subfolder files (let them load)
            if (cleanPath.endsWith('.html') && cleanPath.includes('/')) {
                return;
            }

            // Dashboard
            if (cleanPath.toLowerCase() === 'dashboard') {
                window.location.replace('/pages/dashboard/dashboard.html');
                return;
            }

            // Links
            if (cleanPath.toLowerCase() === 'links' || cleanPath.toLowerCase() === 'link') {
                window.location.replace('/pages/dashboard/links.html');
                return;
            }

            // Username
            if (cleanPath.toLowerCase() === 'username') {
                window.location.replace('/pages/auth/username.html');
                return;
            }

            // Verify
            if (cleanPath.toLowerCase() === 'verify') {
                window.location.replace('/verify.html');
                return;
            }

            // Root
            if (cleanPath === '') {
                window.location.replace('/');
                return;
            }

            // Username profile
            window.location.replace('/pages/profile/profile.html?user=' + encodeURIComponent(cleanPath));
        })();
    </script>
</head>
<body></body>
</html>
