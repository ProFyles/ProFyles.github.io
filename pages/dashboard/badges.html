<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges — Profy</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <style>
        .badge-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .badge-row {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .badge-row.unlocked {
            border-color: rgba(88, 101, 242, 0.4);
            background: linear-gradient(135deg, #0d0d0d 0%, #15152a 100%);
        }
        .badge-row.unlocked::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #5865F2, transparent);
        }
        .badge-row.locked {
            opacity: 0.55;
        }
        .badge-row:hover {
            transform: translateY(-3px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 15px 40px rgba(168, 85, 247, 0.15);
        }
        .badge-icon-wrap {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
        }
        .badge-row.unlocked .badge-icon-wrap img {
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6))
                    drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
        }
        .badge-content {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .badge-name {
            font-size: 18px;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }
        .badge-desc {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }
        .badge-status {
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .badge-row.unlocked .badge-status {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.25);
        }
        .badge-row.locked .badge-status {
            background: rgba(255, 255, 255, 0.05);
            color: #666;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="dashboard-body">

        </button>

                <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#pl)"/>
                <text x="20" y="28" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">P</text>
            </svg>
            <span>Profy</span>
        </div>
        <a href="https://discord.gg/zyzTKZtC2g" target="_blank" class="icon-btn discord-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
            </svg>
        </a>
    </header>

            <a href="/badges" class="nav-item active">

                <span class="nav-label">Settings</span>

            <button id="logout-btn" class="nav-item logout-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>

    <div id="overlay" class="overlay"></div>

    <main class="main-content">
        <h1 class="page-title">🏆 Badges</h1>
        <p style="color:#888;font-size:14px;margin-bottom:20px;">Unlock badges by completing tasks</p>

        <div class="badge-list" id="badge-list"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
    <script>
        const BADGES = [
            {
                id: 'verification',
                name: 'Verification',
                desc: 'Join our Discord server and complete verification to unlock this badge.',
                icon: '../../assets/badges/verification.svg',
                check: (p) => p.verified === true
            },
            {
                id: 'supporter',
                name: 'Supporter',
                desc: 'Given to accounts #0001 to #0100. You are one of the first 100 members!',
                icon: '../../assets/badges/supporter.svg',
                check: (p) => p.uid_number && p.uid_number >= 1 && p.uid_number <= 100
            }
        ];

        async function load() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = '/'; return; }

            const { data: profile } = await supabaseClient
                .from('profiles').select('*').eq('id', user.id).maybeSingle();

            if (!profile) { window.location.href = '/Login'; return; }

            const list = document.getElementById('badge-list');
            list.innerHTML = '';

            BADGES.forEach(badge => {
                const unlocked = badge.check(profile);

                const row = document.createElement('div');
                row.className = 'badge-row ' + (unlocked ? 'unlocked' : 'locked');
                row.innerHTML = `
                    <div class="badge-icon-wrap">
                        <img src="${badge.icon}" alt="${badge.name}">
                    </div>
                    <div class="badge-content">
                        <div class="badge-name">${badge.name}</div>
                        <div class="badge-desc">${badge.desc}</div>
                        <div class="badge-status">
                            ${unlocked ? '✅ Unlocked' : '🔒 Locked'}
                        </div>
                    </div>
                `;
                list.appendChild(row);
            });
        }

        document.getElementById('menu-toggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        });

        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/';
        });

        load();
    </script>

</body>
</html>
