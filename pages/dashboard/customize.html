<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize — Profy</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <style>
        .custom-section {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .custom-section h3 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .custom-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            display: block;
        }
        .custom-input {
            width: 100%;
            height: 48px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 10px;
            color: white;
            padding: 0 16px;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .custom-input:focus { border-color: #5865F2; }
        .custom-textarea {
            width: 100%;
            min-height: 100px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 10px;
            color: white;
            padding: 14px 16px;
            font-size: 14px;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .custom-textarea:focus { border-color: #5865F2; }
        
        .color-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .color-preview {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        .color-input {
            flex: 1;
            height: 40px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 10px;
            color: white;
            padding: 0 12px;
            font-size: 13px;
            outline: none;
            font-family: monospace;
        }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #151515;
        }
        .toggle-row:last-child { border-bottom: none; }
        .toggle-label {
            font-size: 14px;
            color: #ccc;
            font-weight: 500;
        }
        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: #222;
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-switch.active {
            background: #5865F2;
        }
        .toggle-switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch.active::after {
            transform: translateX(22px);
        }
        
        .save-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .save-bar span {
            font-size: 13px;
            color: #888;
        }
        .save-btn {
            padding: 10px 24px;
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .reset-btn {
            background: transparent;
            color: #888;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body class="dashboard-body">

    <header class="topbar">
        <button id="menu-toggle" class="icon-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="topbar-logo">
            <svg width="26" height="26" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="pl" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#5865F2"/></linearGradient></defs>
                <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#pl)"/>
                <text x="20" y="28" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">P</text>
            </svg>
            <span>Profy</span>
        </div>
        <a href="https://discord.gg/zyzTKZtC2g" target="_blank" class="icon-btn discord-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z"/>
            </svg>
        </a>
    </header>

    <aside id="sidebar" class="sidebar">
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span class="nav-label">Account</span>
            </a>
            <a href="/links" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                <span class="nav-label">Links</span>
            </a>
            <a href="/customize" class="nav-item active">
                <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                <span class="nav-label">Customize</span>
            </a>
            <button id="logout-btn" class="nav-item logout-item">
                <svg xmlns="http://www.w3.org/2000/svg" class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span class="nav-label">Logout</span>
            </button>
        </nav>
    </aside>

    <div id="overlay" class="overlay"></div>

    <main class="main-content">
        <h1 class="page-title">🎨 Customize</h1>
        <p style="color:#888;font-size:14px;margin-bottom:20px;">Personalize your profile.</p>

        <div class="custom-section">
            <h3>🖼️ Images</h3>
            <label class="custom-label">Avatar URL</label>
            <input type="text" id="avatar-url" class="custom-input" placeholder="https://...">
            <label class="custom-label">Banner URL</label>
            <input type="text" id="banner-url" class="custom-input" placeholder="https://...">
        </div>

        <div class="custom-section">
            <h3>📝 About</h3>
            <label class="custom-label">Display Name</label>
            <input type="text" id="display-name" class="custom-input" placeholder="Your name" maxlength="30">
            <label class="custom-label">Bio</label>
            <textarea id="bio" class="custom-textarea" placeholder="Tell us about yourself..." maxlength="200"></textarea>
            <label class="custom-label" style="margin-top:12px;">Location</label>
            <input type="text" id="location" class="custom-input" placeholder="City, Country">
        </div>

        <div class="custom-section">
            <h3>🎨 Colors</h3>
            <label class="custom-label">Theme Color</label>
            <div class="color-row">
                <div class="color-preview" id="color-preview" style="background:#a855f7;"></div>
                <input type="text" id="theme-color" class="color-input" value="#a855f7" maxlength="7">
            </div>
        </div>

        <div class="custom-section">
            <h3>✨ Effects</h3>
            <div class="toggle-row">
                <span class="toggle-label">Glow Username</span>
                <div class="toggle-switch" id="glow-username" data-key="glow_username"></div>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Glow Socials</span>
                <div class="toggle-switch" id="glow-socials" data-key="glow_socials"></div>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Glow Badges</span>
                <div class="toggle-switch" id="glow-badges" data-key="glow_badges"></div>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Monochrome Icons</span>
                <div class="toggle-switch" id="monochrome-icons" data-key="monochrome_icons"></div>
            </div>
            <div class="toggle-row">
                <span class="toggle-label">Animated Title</span>
                <div class="toggle-switch" id="animated-title" data-key="animated_title"></div>
            </div>
        </div>

        <div class="custom-section">
            <h3>🎵 Music</h3>
            <label class="custom-label">Music URL</label>
            <input type="text" id="music-url" class="custom-input" placeholder="https://...mp3">
        </div>

        <div style="height: 80px;"></div>
    </main>

    <div class="save-bar">
        <span id="save-status">No changes</span>
        <button class="reset-btn" id="reset-btn">Reset</button>
        <button class="save-btn" id="save-btn">Save Changes</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
    <script>
        let currentUser = null;
        let currentProfile = null;

        async function load() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = '/'; return; }
            currentUser = user;

            const { data: profile } = await supabaseClient
                .from('profiles').select('*').eq('id', user.id).maybeSingle();

            if (!profile) { window.location.href = '/Login'; return; }
            currentProfile = profile;

            document.getElementById('avatar-url').value = profile.avatar_url || '';
            document.getElementById('banner-url').value = profile.banner_url || '';
            document.getElementById('display-name').value = profile.display_name || '';
            document.getElementById('bio').value = profile.bio || '';
            document.getElementById('location').value = profile.location || '';
            document.getElementById('music-url').value = profile.music_url || '';
            document.getElementById('theme-color').value = profile.theme_color || '#a855f7';
            document.getElementById('color-preview').style.background = profile.theme_color || '#a855f7';

            document.querySelectorAll('.toggle-switch').forEach(el => {
                const key = el.getAttribute('data-key');
                if (profile[key]) el.classList.add('active');
            });
        }

        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('input', () => {
                document.getElementById('save-status').textContent = 'Unsaved changes';
                document.getElementById('save-status').style.color = '#fbbf24';
            });
        });

        document.getElementById('theme-color').addEventListener('input', (e) => {
            document.getElementById('color-preview').style.background = e.target.value;
        });

        document.querySelectorAll('.toggle-switch').forEach(el => {
            el.addEventListener('click', () => {
                el.classList.toggle('active');
                document.getElementById('save-status').textContent = 'Unsaved changes';
                document.getElementById('save-status').style.color = '#fbbf24';
            });
        });

        document.getElementById('save-btn').addEventListener('click', async () => {
            const updates = {
                avatar_url: document.getElementById('avatar-url').value.trim() || null,
                banner_url: document.getElementById('banner-url').value.trim() || null,
                display_name: document.getElementById('display-name').value.trim() || null,
                bio: document.getElementById('bio').value.trim() || '',
                location: document.getElementById('location').value.trim() || null,
                music_url: document.getElementById('music-url').value.trim() || null,
                theme_color: document.getElementById('theme-color').value.trim() || '#a855f7',
                glow_username: document.getElementById('glow-username').classList.contains('active'),
                glow_socials: document.getElementById('glow-socials').classList.contains('active'),
                glow_badges: document.getElementById('glow-badges').classList.contains('active'),
                monochrome_icons: document.getElementById('monochrome-icons').classList.contains('active'),
                animated_title: document.getElementById('animated-title').classList.contains('active')
            };

            const { error } = await supabaseClient
                .from('profiles')
                .update(updates)
                .eq('id', currentUser.id);

            if (error) {
                alert('Error: ' + error.message);
                return;
            }

            document.getElementById('save-status').textContent = '✅ Saved!';
            document.getElementById('save-status').style.color = '#4ade80';

            setTimeout(() => {
                document.getElementById('save-status').textContent = 'No changes';
                document.getElementById('save-status').style.color = '#888';
            }, 2000);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (!confirm('Reset all changes?')) return;
            load();
        });

        document.getElementById('menu-toggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        });

        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/';
        });

        load();
    </script>

</body>
</html>
