<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Profy</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/profile.css">
    <style>
        /* Discord Card */
        .discord-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
            max-width: 340px;
            width: 100%;
        }
        .discord-card-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            background: #151515;
            flex-shrink: 0;
            position: relative;
        }
        .discord-card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .discord-card-avatar .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #0d0d0d;
        }
        .discord-card-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .discord-card-name {
            font-size: 14px;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .discord-card-tag {
            font-size: 11px;
            color: #888;
        }
        .discord-card-status {
            font-size: 11px;
            color: #4ade80;
            margin-top: 2px;
        }
        .discord-decoration {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 14px;
        }
        .verified-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #5865F2;
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
        }
        .verified-icon svg {
            width: 12px;
            height: 12px;
            color: white;
        }
    </style>
</head>
<body class="profile-body">

    <div class="bg-media" id="bg-media"></div>
    <div class="bg-overlay"></div>

    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <main id="profile-content" class="profile-container" style="display: none;">

        <!-- Avatar -->
        <div class="avatar-wrapper" id="avatar-wrapper">
            <img id="avatar" class="avatar" src="../../assets/default-avatar.svg" alt="Avatar">
        </div>

        <!-- Username + Verified -->
        <h1 id="display-username" class="display-username">
            username
            <span id="verified-badge" class="verified-icon" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
        </h1>

        <!-- Badges -->
        <div id="badges-container" class="badges-container"></div>

        <!-- Discord Card -->
        <div id="discord-card" class="discord-card" style="display: none;">
            <div class="discord-card-avatar">
                <img id="discord-avatar" src="../../assets/default-avatar.svg" alt="Discord">
                <div id="discord-status-dot" class="status-dot" style="background:#4ade80;"></div>
            </div>
            <div class="discord-card-info">
                <div class="discord-card-name" id="discord-name">discord</div>
                <div class="discord-card-tag" id="discord-tag">#0000</div>
                <div class="discord-card-status" id="discord-status">🟢 Online</div>
            </div>
        </div>

        <!-- Links -->
        <div id="links-container" class="links-container"></div>

        <!-- UID -->
        <p id="display-uid" class="display-uid"></p>

        <!-- Location -->
        <p id="display-location" class="location-badge" style="display:none;"></p>

        <!-- Bio -->
        <p id="display-bio" class="display-bio"></p>

        <!-- Views -->
        <div class="views-counter">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span id="views-count">0</span> views
        </div>

    </main>

    <!-- Spotify Player -->
    <div id="spotify-player" class="spotify-player" style="display: none;">
        <div class="sp-row-top">
            <div class="sp-cover">
                <img id="sp-cover-img" src="../../assets/default-avatar.svg" alt="Cover">
            </div>
            <div class="sp-info">
                <div class="sp-title" id="sp-title">Track Title</div>
                <div class="sp-artist" id="sp-artist">Artist</div>
            </div>
            <div class="sp-controls">
                <button id="sp-prev" class="sp-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line>
                    </svg>
                </button>
                <button id="sp-play" class="sp-btn sp-play-btn">
                    <svg id="sp-play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
                <button id="sp-next" class="sp-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="sp-progress-container">
            <span id="sp-current">0:00</span>
            <div class="sp-progress-bar" id="sp-progress-bar">
                <div class="sp-progress-fill" id="sp-progress-fill"></div>
            </div>
            <span id="sp-duration">0:00</span>
        </div>
    </div>

    <div id="not-found" class="not-found" style="display: none;">
        <h1>404</h1>
        <p>This user does not exist.</p>
        <a href="../../index.html" class="back-home">Go Home</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/global-audio.js"></script>
    <script src="../../js/profile.js"></script>

</body>
</html>
