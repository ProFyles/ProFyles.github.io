<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profy — Choose Username</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%235865F2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='36' height='36' rx='10' fill='url(%23g)'/%3E%3Ctext x='20' y='28' font-family='Arial' font-size='22' font-weight='900' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <main class="login-page">
        <div class="logo">
            <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="profyGradUser" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#a855f7"/>
                        <stop offset="100%" style="stop-color:#5865F2"/>
                    </linearGradient>
                </defs>
                <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#profyGradUser)"/>
                <text x="20" y="28" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">P</text>
            </svg>
            <span>Profy</span>
        </div>
        <h1>Choose your username</h1>
        <p class="subtitle">Pick a unique username for your profile.</p>

        <input
            id="username"
            type="text"
            placeholder="username (min 4 chars)"
            maxlength="20"
            autocomplete="off"
            class="username-input"
        >

        <button id="continue" class="login-button google">Continue</button>
        <div id="message"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/username.js"></script>

</body>
</html>
